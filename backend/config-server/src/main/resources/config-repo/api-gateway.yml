server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: ai-agent-service
          uri: lb://AI-AGENT-SERVICE
          predicates:
            - Path=/api/ai/**

        - id: booking-service
          uri: lb://BOOKING-SERVICE
          predicates:
            - Path=/api/booking/**

        - id: catalog-service
          uri: lb://CATALOG-SERVICE
          predicates:
            - Path=/api/catalog/**

        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/notification/**

        - id: payment-service
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/api/payment/**

        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/user/**

jwt:
  secret: ${JWT_SECRET:my-super-secret-key-for-jwt-signing-min-256-bits-long}
  public-paths: /api/auth/login #пути на которые можно перейти без jwt

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
    health:
      show-details: always